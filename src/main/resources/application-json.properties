# Perfil "json": logs estruturados (uma linha JSON por evento) para Loki/Grafana.
# Ativar com: --spring.profiles.active=json (ou a variável SPRING_PROFILES_ACTIVE=json)

# Formato do log no console. "logstash" gera campos como @timestamp, message, logger_name, level,
# além do MDC (requestId) e dos pares chave/valor de cada log (event, filmId, source, ...)
logging.structured.format.console=logstash
# Campo fixo em toda linha, para filtrar a aplicação no Grafana: {app="desafio"}
logging.structured.json.add.app=${spring.application.name}
