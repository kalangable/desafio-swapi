# Nome da aplicação
spring.application.name=desafio

# ---------------------------------------------------------------------------
# Cliente HTTP (HttpFetcher): vale para todas as fontes de filmes
# ---------------------------------------------------------------------------
# Tempo máximo de espera por uma resposta; passado disso a tentativa conta como falha
http-client.timeout=5s
# Quantas vezes repetir a chamada depois da primeira falha (3 = até 4 tentativas no total)
http-client.max-retries=3
# Espera entre uma tentativa e a seguinte
http-client.retry-backoff=2s

# ---------------------------------------------------------------------------
# Fontes de filmes: uma seção sources.<nome> por fonte
# ---------------------------------------------------------------------------
# SWAPI: endereço base da API
sources.swapi.host=https://swapi.dev/api
# SWAPI: caminho da lista de filmes (somado ao host na chamada)
sources.swapi.resource=/films

# ---------------------------------------------------------------------------
# Paginação das listagens (/films e /franchises/{slug}/films)
# ---------------------------------------------------------------------------
# Página usada quando o parâmetro "page" não é informado (começa em 0)
pagination.default-page=0
# Filmes por página quando o parâmetro "size" não é informado
pagination.default-size=10
# Maior "size" aceito; acima disso a API responde 400
pagination.max-size=100

# ---------------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------------
# Endpoints expostos por HTTP em /actuator (health = saúde da aplicação, info = informações)
management.endpoints.web.exposure.include=health,info
